version: '3.8'

services:
  nginx:
    build: ./nginx
    container_name: nginx_https_public
    volumes:
      - ./nginx/html:/usr/share/nginx/html
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    ports:
      - "8081:80"
      - "8443:443"
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: certbot_https_public
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
